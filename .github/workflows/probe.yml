name: probe

# GitHub's scheduler is best-effort and runs late under load, sometimes by
# tens of minutes. That is tolerable because every sample carries its own
# timestamp and nothing assumes an even cadence — but it is why the public
# methodology page says "roughly every 10 minutes" rather than promising a
# number we don't control.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sweep
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # GitHub-hosted runners live in Azure US East. Naming it honestly
          # matters more than it sounds: a latency number is meaningless
          # without saying where it was taken from.
          PROBE_REGION: iad
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node probe/run.mjs
